<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Trip - Traveloop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <!-- Same sidebar as dashboard -->
            <div class="sidebar-header">
                <i class="fas fa-plane-departure"></i>
                <span>Traveloop</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="my-trips.html" class="nav-item">
                    <i class="fas fa-suitcase"></i>
                    <span>My Trips</span>
                </a>
                <a href="create-trip.html" class="nav-item active">
                    <i class="fas fa-plus"></i>
                    <span>New Trip</span>
                </a>
                <div class="nav-divider"></div>
                <a href="#" class="nav-item" id="themeToggle">
                    <i class="fas fa-moon"></i>
                    <span>Dark Mode</span>
                </a>
                <a href="login.html" class="nav-item" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <h1>Create New Trip</h1>
                <p>Plan your next adventure</p>
            </header>

            <div class="form-container">
                <form id="createTripForm" class="trip-form">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="tripName"><i class="fas fa-flag"></i> Trip Name</label>
                            <input type="text" id="tripName" required placeholder="e.g., Summer Europe 2024">
                        </div>
                        <div class="form-group">
                            <label for="destination"><i class="fas fa-map-marker-alt"></i> Main Destination</label>
                            <input type="text" id="destination" required placeholder="e.g., Paris, France">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="startDate"><i class="fas fa-calendar-alt"></i> Start Date</label>
                            <input type="date" id="startDate" required>
                        </div>
                        <div class="form-group">
                            <label for="endDate"><i class="fas fa-calendar-check"></i> End Date</label>
                            <input type="date" id="endDate" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="budget"><i class="fas fa-dollar-sign"></i> Estimated Budget</label>
                        <input type="number" id="budget" placeholder="e.g., 2500" step="0.01">
                    </div>
                    <div class="form-group">
                        <label for="description"><i class="fas fa-sticky-note"></i> Description</label>
                        <textarea id="description" rows="4" placeholder="Tell us about your trip..."></textarea>
                    </div>
                    <div class="form-actions">
                        <a href="dashboard.html" class="btn btn-secondary">Cancel</a>
                        <button type="submit" class="btn btn-primary">Create Trip</button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/trips.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
