<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - Traveloop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar"><!-- Same sidebar --></aside>
        <main class="main-content">
            <header class="page-header">
                <h1 id="notesTripTitle">Travel Journal</h1>
                <p>Capture memories and important notes</p>
            </header>

            <div class="notes-container">
                <div class="notes-form">
                    <div class="form-group">
                        <label><i class="fas fa-sticky-note"></i> New Note</label>
                        <textarea id="newNote" rows="4" placeholder="What happened today? Any tips for future trips?"></textarea>
                    </div>
                    <button id="addNoteBtn" class="btn btn-primary">Add Note</button>
                </div>

                <div id="notesList" class="notes-grid">
                    <!-- Dynamic notes -->
                </div>
            </div>
        </main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/trips.js"></script>
    <script src="js/notes.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
