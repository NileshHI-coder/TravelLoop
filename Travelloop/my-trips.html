<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trips - Traveloop</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <!-- Same sidebar -->
            <div class="sidebar-header">
                <i class="fas fa-plane-departure"></i>
                <span>Traveloop</span>
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item">
                    <i class="fas fa-tachometer-alt"></i>
                    <span>Dashboard</span>
                </a>
                <a href="my-trips.html" class="nav-item active">
                    <i class="fas fa-suitcase"></i>
                    <span>My Trips</span>
                </a>
                <a href="create-trip.html" class="nav-item">
                    <i class="fas fa-plus"></i>
                    <span>New Trip</span>
                </a>
                <div class="nav-divider"></div>
                <a href="#" class="nav-item" id="themeToggle">
                    <i class="fas fa-moon"></i>
                    <span>Dark Mode</span>
                </a>
                <a href="login.html" class="nav-item" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i>
                    <span>Logout</span>
                </a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="page-header">
                <h1>My Trips</h1>
                <p>All your travel plans in one place</p>
            </header>

            <div class="trips-container">
                <div id="tripsList" class="trips-grid">
                    <!-- Dynamic trip cards will be loaded here -->
                </div>
            </div>
        </main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/trips.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
